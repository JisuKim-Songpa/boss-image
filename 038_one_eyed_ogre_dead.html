<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>외눈 오우거 - 붕괴한 거구</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="외눈 오우거 - 붕괴한 거구" />
  <meta property="og:description" content="쿵... 힘이 풀린 거구가 바닥에 쓰러지고 곤봉도 손에서 미끄러진다." />
  <meta property="og:url" content="https://jisukim-songpa.github.io/boss-image/038_one_eyed_ogre_dead.html" />
  <meta property="og:image" content="https://jisukim-songpa.github.io/boss-image/038_one_eyed_ogre_dead.png" />
  <meta property="og:image:secure_url" content="https://jisukim-songpa.github.io/boss-image/038_one_eyed_ogre_dead.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="600" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="외눈 오우거 - 붕괴한 거구" />
  <meta name="twitter:description" content="쿵... 힘이 풀린 거구가 바닥에 쓰러지고 곤봉도 손에서 미끄러진다." />
  <meta name="twitter:image" content="https://jisukim-songpa.github.io/boss-image/038_one_eyed_ogre_dead.png" />

  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --card: rgba(255, 255, 255, 0.88);
      --text: #172033;
      --sub: #4b5b7a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      color: var(--text);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .wrap {
      width: min(100%, 1200px);
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(23, 32, 51, 0.14);
      background: #fff;
    }
    .boss-img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1200 / 600;
      object-fit: contain;
      background: #fff;
    }
    .caption {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 24px;
      padding: 18px 22px;
      border-radius: 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(23, 32, 51, 0.12);
    }
    .name {
      margin: 0 0 6px;
      font-size: clamp(24px, 3.1vw, 52px);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -0.04em;
    }
    .state {
      color: var(--sub);
      font-size: clamp(15px, 1.45vw, 25px);
      font-weight: 800;
      margin-left: 8px;
    }
    .line {
      margin: 0;
      font-size: clamp(17px, 1.9vw, 32px);
      line-height: 1.36;
      font-weight: 750;
      letter-spacing: -0.035em;
      word-break: keep-all;
    }
    @media (max-width: 720px) {
      body { padding: 10px; }
      .wrap { border-radius: 18px; }
      .caption {
        left: 12px;
        right: 12px;
        bottom: 12px;
        padding: 12px 14px;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="boss-img" src="../images/038_one_eyed_ogre_dead.png" alt="외눈 오우거 - 붕괴한 거구" />
    <section class="caption" aria-label="외눈 오우거 - 붕괴한 거구 설명">
      <h1 class="name">외눈 오우거<span class="state">붕괴한 거구</span></h1>
      <p class="line">쿵... 힘이 풀린 거구가 바닥에 쓰러지고 곤봉도 손에서 미끄러진다.</p>
    </section>
  </main>
</body>
</html>
